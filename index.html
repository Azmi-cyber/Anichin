<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anichin - Streaming Donghua</title>
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #0b0b0f;
            color: #e8e8e8;
            line-height: 1.6;
            min-height: 100vh;
        }
        a {
            text-decoration: none;
            color: inherit;
        }
        img {
            max-width: 100%;
            display: block;
        }

        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1a1a1a;
        }
        ::-webkit-scrollbar-thumb {
            background: #f5c518;
            border-radius: 4px;
        }

        /* ===== HEADER ===== */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 30px;
            background: #111118;
            border-bottom: 3px solid #f5c518;
            flex-wrap: wrap;
            gap: 10px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 30px rgba(245, 197, 24, 0.08);
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .logo img {
            height: 45px;
            width: auto;
            border-radius: 10px;
            background: #1a1a2e;
            padding: 4px;
        }
        .logo span {
            font-size: 1.8rem;
            font-weight: 800;
            color: #f5c518;
            letter-spacing: 1px;
            text-shadow: 0 0 20px rgba(245, 197, 24, 0.15);
        }
        nav {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 12px;
        }
        nav a {
            color: #aaa;
            font-weight: 500;
            padding: 6px 14px;
            border-radius: 30px;
            transition: all 0.3s ease;
            font-size: 0.85rem;
            border: 1px solid transparent;
        }
        nav a:hover {
            color: #fff;
            background: rgba(245, 197, 24, 0.12);
            border-color: rgba(245, 197, 24, 0.2);
        }
        nav a.active {
            color: #0b0b0f;
            background: #f5c518;
            border-color: #f5c518;
            font-weight: 600;
        }
        nav a.search-link {
            background: #1e1e2e;
            padding: 6px 16px;
            border-radius: 30px;
            border: 1px solid #2a2a3e;
        }
        nav a.search-link:hover {
            background: #f5c518;
            color: #0b0b0f;
            border-color: #f5c518;
        }

        /* ===== MAIN ===== */
        main {
            max-width: 1300px;
            margin: 0 auto;
            padding: 20px 30px;
        }

        /* ===== HERO ===== */
        .hero {
            text-align: center;
            padding: 50px 20px 35px;
            background: linear-gradient(145deg, #12121f, #1a1a2e);
            border-radius: 20px;
            margin-bottom: 30px;
            border: 1px solid #2a2a4e;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.4);
        }
        .hero h1 {
            font-size: 3rem;
            color: #f5c518;
            margin-bottom: 8px;
            text-shadow: 0 0 40px rgba(245, 197, 24, 0.15);
        }
        .hero p {
            color: #aaa;
            font-size: 1.1rem;
        }

        /* ===== SECTION TITLE ===== */
        .section-title {
            font-size: 1.6rem;
            color: #f5c518;
            margin: 30px 0 18px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .section-title span {
            font-size: 1.8rem;
        }

        /* ===== DONGHUA GRID ===== */
        .donghua-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
            gap: 20px;
        }
        .donghua-card {
            background: #14141f;
            border-radius: 16px;
            overflow: hidden;
            transition: all 0.3s ease;
            border: 1px solid #22223a;
        }
        .donghua-card:hover {
            transform: translateY(-6px);
            border-color: #f5c518;
            box-shadow: 0 8px 30px rgba(245, 197, 24, 0.12);
        }
        .donghua-card a {
            display: block;
        }
        .donghua-card img {
            width: 100%;
            aspect-ratio: 2/3;
            object-fit: cover;
            background: #1a1a2e;
        }
        .donghua-card .info {
            padding: 12px 14px 16px;
        }
        .donghua-card .info h3 {
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 4px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .donghua-card .info .ep {
            font-size: 0.8rem;
            color: #f5c518;
        }
        .donghua-card .info .genre {
            font-size: 0.7rem;
            color: #888;
            margin-top: 4px;
        }

        /* ===== LOAD MORE ===== */
        .load-more {
            display: block;
            margin: 30px auto;
            padding: 12px 40px;
            background: #f5c518;
            color: #0b0b0f;
            border: none;
            border-radius: 30px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .load-more:hover {
            transform: scale(1.03);
            box-shadow: 0 4px 25px rgba(245, 197, 24, 0.3);
        }
        .load-more:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* ===== SCHEDULE ===== */
        .schedule-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 14px;
        }
        .schedule-item {
            background: #14141f;
            padding: 18px 22px;
            border-radius: 14px;
            border-left: 5px solid #f5c518;
            border: 1px solid #22223a;
            border-left-width: 5px;
            transition: 0.3s;
        }
        .schedule-item:hover {
            background: #1a1a2e;
            border-color: #f5c518;
        }
        .schedule-item .day {
            font-weight: 700;
            color: #f5c518;
            font-size: 1.1rem;
        }
        .schedule-item .title {
            color: #ddd;
            font-size: 0.95rem;
        }
        .schedule-item .time {
            color: #888;
            font-size: 0.8rem;
        }

        /* ===== DETAIL ===== */
        .detail-container {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 30px;
            background: #14141f;
            border-radius: 20px;
            padding: 30px;
            border: 1px solid #22223a;
        }
        .detail-container .poster img {
            width: 100%;
            border-radius: 14px;
            aspect-ratio: 2/3;
            object-fit: cover;
        }
        .detail-container .info h2 {
            font-size: 2rem;
            color: #f5c518;
            margin-bottom: 8px;
        }
        .detail-container .info .meta {
            color: #aaa;
            font-size: 0.95rem;
            margin-bottom: 12px;
        }
        .detail-container .info .synopsis {
            color: #ccc;
            line-height: 1.8;
        }
        .detail-container .info .genre-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 12px 0;
        }
        .detail-container .info .genre-tags span {
            background: #2a2a4e;
            padding: 4px 16px;
            border-radius: 30px;
            font-size: 0.8rem;
            color: #f5c518;
        }

        .episode-list {
            margin-top: 25px;
        }
        .episode-list h3 {
            color: #f5c518;
            margin-bottom: 12px;
            font-size: 1.3rem;
        }
        .episode-list .ep-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 18px;
            background: #1a1a2e;
            border-radius: 10px;
            margin-bottom: 6px;
            transition: 0.2s;
            border-left: 3px solid #2a2a4e;
        }
        .episode-list .ep-item:hover {
            border-left-color: #f5c518;
            background: #22223a;
        }
        .episode-list .ep-item a {
            color: #ddd;
        }
        .episode-list .ep-item a:hover {
            color: #f5c518;
        }
        .episode-list .ep-item .date {
            color: #888;
            font-size: 0.8rem;
        }

        /* ===== SEARCH ===== */
        .search-box {
            display: flex;
            gap: 12px;
            max-width: 550px;
            margin: 0 auto 30px;
        }
        .search-box input {
            flex: 1;
            padding: 14px 24px;
            border-radius: 40px;
            border: 2px solid #2a2a3e;
            background: #14141f;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
        }
        .search-box input:focus {
            border-color: #f5c518;
        }
        .search-box button {
            padding: 14px 32px;
            border-radius: 40px;
            border: none;
            background: #f5c518;
            color: #0b0b0f;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
        }
        .search-box button:hover {
            transform: scale(1.03);
        }

        /* ===== AZ LIST ===== */
        .az-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 25px;
        }
        .az-grid a {
            padding: 10px 20px;
            background: #14141f;
            border-radius: 30px;
            color: #ccc;
            font-weight: 700;
            transition: 0.3s;
            border: 1px solid #2a2a3e;
        }
        .az-grid a:hover,
        .az-grid a.active {
            background: #f5c518;
            color: #0b0b0f;
            border-color: #f5c518;
        }

        /* ===== BACK BUTTON ===== */
        .back-btn {
            display: inline-block;
            margin-bottom: 20px;
            color: #f5c518;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }
        .back-btn:hover {
            text-decoration: underline;
        }

        /* ===== FOOTER ===== */
        footer {
            text-align: center;
            padding: 30px 20px;
            margin-top: 40px;
            border-top: 1px solid #1a1a2e;
            color: #666;
            font-size: 0.9rem;
        }

        /* ===== LOADING ===== */
        .loading {
            text-align: center;
            padding: 40px;
            color: #888;
        }
        .loading::after {
            content: '...';
            animation: dots 1.5s steps(4, end) infinite;
        }
        @keyframes dots {
            0% {
                content: '';
            }
            25% {
                content: '.';
            }
            50% {
                content: '..';
            }
            75% {
                content: '...';
            }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            header {
                padding: 10px 16px;
            }
            .logo span {
                font-size: 1.3rem;
            }
            .logo img {
                height: 35px;
            }
            nav a {
                font-size: 0.75rem;
                padding: 4px 10px;
            }
            main {
                padding: 12px 16px;
            }
            .hero h1 {
                font-size: 2rem;
            }
            .donghua-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 14px;
            }
            .detail-container {
                grid-template-columns: 1fr;
                padding: 18px;
            }
            .detail-container .poster img {
                max-width: 250px;
                margin: 0 auto;
            }
            .search-box {
                flex-direction: column;
            }
            .schedule-list {
                grid-template-columns: 1fr;
            }
        }
        @media (max-width: 480px) {
            .donghua-grid {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
                gap: 10px;
            }
            .donghua-card .info h3 {
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEhqeOiwZWG2La8qhHTFZMbvRozl2k_kTfOdglj7YckS5eUsElqHDz-K4o9MpjnGoZHDQ_hsUUCAuYSqKrebJKWWZdlj1eVgJtCZJoi0RtS5Be3PShSc8pIIlQfDGr65IJHiHAL_EY_M5J5OY5LkEGGmO0CTBj23sV1lW-nRAWxqxYZ2rHQX-12KE7n5_vQ/s320/NewLogo.png" alt="Anichin Logo" />
            <span>Anichin</span>
        </div>
        <nav id="main-nav">
            <a href="#" data-page="home" class="active">Home</a>
            <a href="#" data-page="ongoing">Ongoing</a>
            <a href="#" data-page="completed">Completed</a>
            <a href="#" data-page="latest">Latest</a>
            <a href="#" data-page="schedule">Schedule</a>
            <a href="#" data-page="az-list">AZ List</a>
            <a href="#" data-page="genres">Genres</a>
            <a href="#" data-page="seasons">Seasons</a>
            <a href="#" data-page="search" class="search-link">🔍</a>
        </nav>
    </header>

    <main id="app">
        <!-- ===== HERO ===== -->
        <div class="hero" id="hero">
            <h1>🐉 Anichin</h1>
            <p>Streaming Donghua Subtitle Indonesia • Update Setiap Hari</p>
        </div>

        <!-- ===== CONTENT ===== -->
        <div id="content"></div>
    </main>

    <footer>
        <p>&copy; 2026 Anichin. All rights reserved.</p>
    </footer>

    <script>
        // ============================================================
        //  API CONFIG — PAKE BACKEND PROXY
        // ============================================================
        const API_BASE = '/api/anime';

        // ============================================================
        //  STATE
        // ============================================================
        let currentPage = 'home';
        let currentParams = {};
        let hasMore = true;

        // ============================================================
        //  DOM REFS
        // ============================================================
        const content = document.getElementById('content');
        const navLinks = document.querySelectorAll('#main-nav a[data-page]');
        const hero = document.getElementById('hero');

        // ============================================================
        //  API CALL
        // ============================================================
        async function fetchAPI(endpoint) {
            try {
                const url = `${API_BASE}?endpoint=${encodeURIComponent(endpoint)}`;
                console.log('📡 Request:', url);
                const res = await fetch(url);
                const json = await res.json();
                console.log('✅ Response:', json);
                if (json.success && json.data) {
                    return json.data;
                }
                return null;
            } catch (e) {
                console.error('❌ Error:', e);
                return null;
            }
        }

        // ============================================================
        //  FALLBACK DATA (kalo API mati)
        // ============================================================
        const FALLBACK = {
            home: [
                { title: 'Battle Through the Heavens', slug: 'btth', thumbnail: 'https://via.placeholder.com/300x400?text=BTTH', episode: 'Episode 500' },
                { title: 'Soul Land', slug: 'soul-land', thumbnail: 'https://via.placeholder.com/300x400?text=Soul+Land', episode: 'Episode 300' },
                { title: 'Martial Universe', slug: 'martial-universe', thumbnail: 'https://via.placeholder.com/300x400?text=Martial+Universe', episode: 'Episode 150' },
                { title: 'The King\'s Avatar', slug: 'king-avatar', thumbnail: 'https://via.placeholder.com/300x400?text=King+Avatar', episode: 'Episode 50' },
                { title: 'Link Click', slug: 'link-click', thumbnail: 'https://via.placeholder.com/300x400?text=Link+Click', episode: 'Episode 12' },
                { title: 'Scissor Seven', slug: 'scissor-seven', thumbnail: 'https://via.placeholder.com/300x400?text=Scissor+Seven', episode: 'Episode 20' },
            ],
            schedule: [
                { day: 'Senin', title: 'Battle Through the Heavens' },
                { day: 'Selasa', title: 'Soul Land' },
                { day: 'Rabu', title: 'Martial Universe' },
                { day: 'Kamis', title: 'The King\'s Avatar' },
                { day: 'Jumat', title: 'Link Click' },
                { day: 'Sabtu', title: 'Scissor Seven' },
                { day: 'Minggu', title: 'Spare Me Great Lord' },
            ],
            genres: [
                { name: 'Action', slug: 'action' },
                { name: 'Adventure', slug: 'adventure' },
                { name: 'Comedy', slug: 'comedy' },
                { name: 'Drama', slug: 'drama' },
                { name: 'Fantasy', slug: 'fantasy' },
                { name: 'Romance', slug: 'romance' },
                { name: 'Sci-Fi', slug: 'sci-fi' },
                { name: 'Slice of Life', slug: 'slice-of-life' },
            ]
        };

        // ============================================================
        //  RENDER HELPERS
        // ============================================================
        function renderDonghuaGrid(items, container, showLoadMore = true) {
            const data = items && items.length ? items : FALLBACK.home;
            if (!data || !data.length) {
                container.innerHTML = '<p style="color:#888;text-align:center;padding:40px;">Tidak ada data ditemukan.</p>';
                return;
            }
            let html = '<div class="donghua-grid">';
            data.forEach(item => {
                const title = item.title || item.judul || 'Unknown';
                const slug = item.slug || '';
                const thumb = item.thumbnail || item.poster || item.thumb || 'https://via.placeholder.com/300x400?text=No+Image';
                const ep = item.episode || item.eps || '';
                const genre = item.genre || item.genres || '';
                html += `
                    <div class="donghua-card">
                        <a href="#" data-action="detail" data-slug="${slug}">
                            <img src="${thumb}" alt="${title}" loading="lazy" />
                            <div class="info">
                                <h3>${title}</h3>
                                ${ep ? `<div class="ep">📺 ${ep}</div>` : ''}
                                ${genre ? `<div class="genre">${genre}</div>` : ''}
                            </div>
                        </a>
                    </div>
                ';
                            });
            html += '</div>';
            container.innerHTML = html;

            container.querySelectorAll('[data-action="detail"]').forEach(el => {
                el.addEventListener('click', (e) => {
                    e.preventDefault();
                    const slug = el.dataset.slug;
                    if (slug) navigateTo('detail', { slug });
                });
            });

            if (showLoadMore) {
                const btn = document.createElement('button');
                btn.className = 'load-more';
                btn.textContent = 'Muat Lebih Banyak';
                btn.id = 'load-more-btn';
                btn.addEventListener('click', () => {
                    if (currentPage === 'home') loadHome((currentParams.page || 1) + 1);
                    else if (currentPage === 'ongoing') loadOngoing((currentParams.page || 1) + 1);
                    else if (currentPage === 'completed') loadCompleted((currentParams.page || 1) + 1);
                    else if (currentPage === 'latest') loadLatest((currentParams.page || 1) + 1);
                    else if (currentPage === 'genres') loadGenre(currentParams.slug, (currentParams.page || 1) + 1);
                    else if (currentPage === 'seasons') loadSeason(currentParams.year, (currentParams.page || 1) + 1);
                    else if (currentPage === 'az-list') loadAZ(currentParams.slug, (currentParams.page || 1) + 1);
                });
                container.appendChild(btn);
            }
        }

        function renderSchedule(items, container) {
            const data = items && items.length ? items : FALLBACK.schedule;
            if (!data || !data.length) {
                container.innerHTML = '<p style="color:#888;text-align:center;padding:40px;">Tidak ada jadwal.</p>';
                return;
            }
            let html = '<div class="schedule-list">';
            data.forEach(item => {
                const day = item.day || item.hari || '';
                const title = item.title || item.judul || '';
                const time = item.time || item.jam || '';
                html += `
                    <div class="schedule-item">
                        <div class="day">${day}</div>
                        <div class="title">${title}</div>
                        ${time ? `<div class="time">⏰ ${time}</div>` : ''}
                    </div>
                `;
            });
            html += '</div>';
            container.innerHTML = html;
        }

        function renderDetail(data, container) {
            if (!data) {
                container.innerHTML = '<p style="color:#888;text-align:center;padding:40px;">Detail tidak ditemukan.</p>';
                return;
            }
            const title = data.title || data.judul || 'Unknown';
            const thumb = data.thumbnail || data.poster || data.thumb || 'https://via.placeholder.com/300x400?text=No+Image';
            const synopsis = data.synopsis || data.sinopsis || data.description || 'Tidak ada sinopsis.';
            const genres = data.genres || data.genre || [];
            const episodes = data.episodes || data.episode_list || [];

            let html = `
                <div class="detail-container">
                    <div class="poster">
                        <img src="${thumb}" alt="${title}" />
                    </div>
                    <div class="info">
                        <h2>${title}</h2>
                        <div class="meta">
                            ${data.status ? `📌 ${data.status}` : ''}
                            ${data.year ? ` • 📅 ${data.year}` : ''}
                            ${data.type ? ` • 🎬 ${data.type}` : ''}
                        </div>
                        ${genres.length ? `<div class="genre-tags">${genres.map(g => `<span>${g}</span>`).join('')}</div>` : ''}
                        <div class="synopsis">${synopsis}</div>
                    </div>
                </div>
                ${episodes.length ? `
                    <div class="episode-list">
                        <h3>📺 Daftar Episode</h3>
                        ${episodes.map(ep => `
                            <div class="ep-item">
                                <a href="#" data-action="episode" data-slug="${ep.slug || ep}">${ep.title || ep}</a>
                                ${ep.date ? `<span class="date">${ep.date}</span>` : ''}
                            </div>
                        `).join('')}
                    </div>
                ` : ''}
                <div style="margin-top:20px;">
                    <a href="#" data-action="back" class="back-btn">← Kembali</a>
                </div>
            `;
            container.innerHTML = html;

            container.querySelectorAll('[data-action="episode"]').forEach(el => {
                el.addEventListener('click', (e) => {
                    e.preventDefault();
                    const slug = el.dataset.slug;
                    if (slug) navigateTo('episode', { slug });
                });
            });

            container.querySelector('[data-action="back"]')?.addEventListener('click', (e) => {
                e.preventDefault();
                navigateTo('home');
            });
        }

        function renderEpisode(data, container) {
            if (!data) {
                container.innerHTML = '<p style="color:#888;text-align:center;padding:40px;">Episode tidak ditemukan.</p>';
                return;
            }
            const title = data.title || data.judul || 'Episode';
            const streams = data.streams || data.streaming || data.download || [];

            let html = `
                <div style="background:#14141f;border-radius:16px;padding:25px;border:1px solid #22223a;">
                    <h2 style="color:#f5c518;">🎬 ${title}</h2>
                    ${streams.length ? `
                        <div style="margin:20px 0;">
                            <h3 style="color:#f5c518;">▶️ Streaming</h3>
                            ${streams.map(s => `
                                <div style="padding:12px 18px;background:#1a1a2e;border-radius:10px;margin-bottom:6px;border-left:3px solid #f5c518;">

        function renderGenres(data, container) {
            const items = data && data.length ? data : FALLBACK.genres;
            if (!items || !items.length) {
                container.innerHTML = '<p style="color:#888;text-align:center;padding:40px;">Tidak ada genre.</p>';
                return;
            }
            let html = '<div class="donghua-grid" style="grid-template-columns:repeat(auto-fill,minmax(160px,1fr));">';
            items.forEach(item => {
                const name = item.name || item.genre || item;
                const slug = item.slug || item;
                html += `
                    <div class="donghua-card" style="text-align:center;padding:20px;">
                        <a href="#" data-action="genre" data-slug="${slug}">
                            <div style="font-size:1.1rem;font-weight:600;color:#f5c518;">${name}</div>
                        </a>
                    </div>
                `;
            });
            html += '</div>';
            container.innerHTML = html;

            container.querySelectorAll('[data-action="genre"]').forEach(el => {
                el.addEventListener('click', (e) => {
                    e.preventDefault();
                    const slug = el.dataset.slug;
                    if (slug) navigateTo('genres', { slug, page: 1 });
                });
            });
        }

        function renderAZ(container) {
            const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
            let html = '<div class="az-grid">';
            letters.forEach(letter => {
                html += `<a href="#" data-action="az" data-slug="${letter}">${letter}</a>`;
            });
            html += '</div><div id="az-content"></div>';
            container.innerHTML = html;

            container.querySelectorAll('[data-action="az"]').forEach(el => {
                el.addEventListener('click', (e) => {
                    e.preventDefault();
                    const slug = el.dataset.slug;
                    if (slug) {
                        document.querySelectorAll('.az-grid a').forEach(a => a.classList.remove('active'));
                        el.classList.add('active');
                        navigateTo('az-list', { slug, page: 1 });
                    }
                });
            });
        }

        function renderSeasons(container) {
            const years = ['2023', '2024', '2025', '2026'];
            let html = '<div style="display:flex;flex-wrap:wrap;gap:10px;margin-bottom:20px;">';
            years.forEach(year => {
                html += `<a href="#" data-action="season" data-year="${year}" style="padding:10px 24px;background:#14141f;border-radius:30px;color:#ccc;border:1px solid #2a2a3e;transition:0.3s;">${year}</a>`;
            });
            html += '</div><div id="season-content"></div>';
            container.innerHTML = html;

            container.querySelectorAll('[data-action="season"]').forEach(el => {
                el.addEventListener('click', (e) => {
                    e.preventDefault();
                    const year = el.dataset.year;
                    if (year) {
                        document.querySelectorAll('[data-action="season"]').forEach(a => {
                            a.style.background = '#14141f';
                            a.style.color = '#ccc';
                        });
                        el.style.background = '#f5c518';
                        el.style.color = '#0b0b0f';
                        navigateTo('seasons', { year, page: 1 });
                    }
                });
            });
        }

            container.innerHTML = `

                    <div class="search-box">

                    <div id="search-results"></div>

            `;
            document.getElementById('search-btn').addEventListener('click', () => {
                const keyword = document.getElementById('search-input').value.trim();
                if (keyword) {
                    loadSearch(keyword);

            });
            document.getElementById('search-input').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    document.getElementById('search-btn').click();
                }
            });
        }
